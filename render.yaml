# Render.com Blueprint (must live at repo root to be detected).
# Free tier — for trial/demo use: SQLite resets on restart (ephemeral disk)
# and outbound SMTP is blocked (invitation emails use BREVO_API_KEY /
# RESEND_API_KEY over HTTPS automatically).
services:
  - type: web
    name: analytics-platform
    runtime: node
    plan: free
    region: frankfurt        # closest free region to the Middle East
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      # استمرارية الحسابات: أنشئ قاعدة مجانية على https://turso.tech وضع
      # libsql://... والتوكن في Dashboard → Environment لتفادي مسح users عند النشر
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically — the server reads process.env.PORT
      - key: PUBLIC_BASE_URL
        sync: false         # set in the dashboard, e.g. https://data-analist-allthing.onrender.com
      # ---- Email: HTTP APIs first (SMTP is blocked on Render's free plan) ----
      - key: BREVO_API_KEY
        sync: false         # free tier: 300 emails/day, works with a verified Gmail sender
      - key: RESEND_API_KEY
        sync: false         # optional — needs a verified domain
      # ---- SMTP fallback (works on VPS/Oracle only, kept for parity) ----
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false         # set in the dashboard (never commit)
      - key: SMTP_PASS
        sync: false         # set in the dashboard (never commit)
      - key: SMTP_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Server-wide AI key: enables AI features for every user without their
      # own key (server-key fallback). Get one at https://openrouter.ai/keys
      - key: OPENROUTER_API_KEY
        sync: false
      # Daily per-user cap on server-key AI usage (protects the shared credit);
      # users with their own key and local Ollama are never counted. 0 = unlimited.
      - key: AI_SERVER_DAILY_LIMIT
        value: "100"
      - key: AI_SERVER_ADMIN_DAILY_LIMIT
        value: "0"
      # Imported datasets persist to SQLite (data/auth.db) so they survive page
      # reloads. Per-dataset upload cap in MB — keep within the free 512MB disk.
      - key: DATASET_SERVER_LIMIT_MB
        value: "10"
      # Per-user dashboards & workspace state (reports/stories/refresh schedules)
      # persist to SQLite with strict user_id isolation (privacy). Cap in MB per
      # dashboard/state blob — keep within the free 512MB disk.
      - key: WORKSPACE_STATE_LIMIT_MB
        value: "5"
      # ---- AI model fallbacks (all server-keyed; users with local Ollama bypass these) ----
      - key: GEMINI_API_KEY
        sync: false         # Google AI Studio — required for core AI features
      - key: OPENROUTER_API_KEY
        sync: false         # OpenRouter gateway — primary LLM provider
      - key: CUSTOM_OPENAI_API_KEY
        sync: false         # Optional: vLLM / LM Studio / LocalAI compatibility layer
      - key: CUSTOM_OPENAI_ENDPOINT
        sync: false         # Optional: defaults to http://localhost:8000/v1
      - key: DEEPSEEK_API_KEY
        sync: false         # Optional: DeepSeek models
      - key: QWEN_API_KEY
        sync: false         # Optional: Alibaba DashScope / Qwen models
      # ---- Third-party email & auth helpers ----
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AGENTMAIL_API_KEY
        sync: false         # AgentMail transactional mail relay
      - key: OTP_DEV_API_KEY
        sync: false         # OTP Dev one-time-password verification
      - key: FREELLMAPI_API_KEY
        sync: false         # FreeLLM local proxy API key
      - key: FREELLMAPI_ENDPOINT
        value: "http://127.0.0.1:31415/v1"
      - key: GMAIL_APP_PASSWORD
        sync: false         # Gmail App Password (alternative to SMTP_PASS)
      - key: APP_URL
        sync: false         # Public-facing app URL (used for OAuth callbacks)
