<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<style>
html, body { margin: 0; padding: 0; }
body {
  width: 720pt; height: 405pt;
  box-sizing: border-box;
  padding: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
  background: #0b1220;
  font-family: Arial, sans-serif;
  position: relative;
}
.bgimg { position: absolute; top: 0; left: 0; width: 720pt; height: 405pt; opacity: 0.45; object-fit: cover; }
.overlay { position: absolute; top: 0; left: 0; width: 720pt; height: 405pt; background: #0b1220; opacity: 0.45; }
.content {
  position: relative; z-index: 2;
  flex: 1 1 0; min-height: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 0 70pt;
}
h1 { color: #ffffff; font-size: 30pt; margin: 0 0 14pt 0; }
h2 { color: #cbd5e1; font-size: 14pt; margin: 0 0 26pt 0; font-weight: normal; line-height: 1.5; }
.cta {
  background: #2563eb; border-radius: 10pt; padding: 12pt 30pt; display: inline-flex;
}
.cta p { color: #ffffff; font-size: 14pt; font-weight: bold; margin: 0; }
</style>
</head>
<body>
<img class="bgimg" src="../assets/hero.png" />
<div class="overlay"></div>
<div class="content">
  <h1>Start Your Data Journey Toward Smarter Decisions Today</h1>
  <h2>Join the companies that moved from scattered spreadsheets to instant AI-powered analytics</h2>
  <div class="cta"><p>Book Your Free Demo Now</p></div>
</div>
</body>
</html>
